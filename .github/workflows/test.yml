name: Test Examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test ${{ matrix.example }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        example:
          - counter
          - chat
          - todos
          - graceful-shutdown
          - testing/01_basic
          # Disabled examples that require internal/observe package
          # - observability
          # - production/single-host
          # - trace-correlation

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Install dependencies
      working-directory: ${{ matrix.example }}
      run: go mod download

    - name: Build
      working-directory: ${{ matrix.example }}
      run: go build -v .

    - name: Test
      working-directory: ${{ matrix.example }}
      run: go test -v -race -timeout=5m ./...
      env:
        CGO_ENABLED: 1

  # Check that disabled examples at least download dependencies correctly
  check-disabled:
    name: Check ${{ matrix.example }} (disabled)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        example:
          - observability
          - production/single-host
          - trace-correlation

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Check dependencies
      working-directory: ${{ matrix.example }}
      run: |
        echo "⚠️ This example is currently disabled"
        echo "Reason: Uses internal/observe package which needs to be exported"
        go mod download
        echo "✓ Dependencies download successfully"
