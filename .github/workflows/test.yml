name: Test Examples

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-all:
    name: Test All Examples
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Run test script
      run: ./test-all.sh
      env:
        CGO_ENABLED: 1

  # Matrix testing for individual examples (parallel)
  test-individual:
    name: Test ${{ matrix.example }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        example:
          - counter
          - chat
          - todos
          - live-preview
          - todos-progressive
          - profile-progressive
          - ws-disabled
          - login
          - todos-components
          - shared-notepad
          - flash-messages

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Build
      run: go build -v ./...
      env:
        CGO_ENABLED: 1

    - name: Test
      working-directory: ${{ matrix.example }}
      run: go test -v -race -timeout=5m ./...
      env:
        CGO_ENABLED: 1
